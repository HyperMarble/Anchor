name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            name: anchor-macos-intel
            archive: anchor-macos-intel.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: anchor-macos-arm
            archive: anchor-macos-arm.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: anchor-linux-x64
            archive: anchor-linux-x64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: anchor-windows-x64
            archive: anchor-windows-x64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Go (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-go@v5
        with:
          go-version-file: lockd/go.mod
          cache-dependency-path: lockd/go.sum

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build lock daemon (Windows)
        if: runner.os == 'Windows'
        working-directory: lockd
        run: go build -trimpath -o "../target/${{ matrix.target }}/release/anchor-lockd.exe" .

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/anchor.exe" --help
          & "target/${{ matrix.target }}/release/anchor-lockd.exe" -h

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.archive }} anchor
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(
            "target/${{ matrix.target }}/release/anchor.exe",
            "target/${{ matrix.target }}/release/anchor-lockd.exe",
            "LICENSE"
          )
          Compress-Archive -Path $files -DestinationPath "${{ matrix.archive }}"

      - name: Checksum (Unix)
        if: runner.os != 'Windows'
        run: shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.archive }}").Hash.ToLower()
          Set-Content -Path "${{ matrix.archive }}.sha256" -Value "$hash  ${{ matrix.archive }}" -NoNewline -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            anchor-macos-intel/anchor-macos-intel.tar.gz
            anchor-macos-intel/anchor-macos-intel.tar.gz.sha256
            anchor-macos-arm/anchor-macos-arm.tar.gz
            anchor-macos-arm/anchor-macos-arm.tar.gz.sha256
            anchor-linux-x64/anchor-linux-x64.tar.gz
            anchor-linux-x64/anchor-linux-x64.tar.gz.sha256
            anchor-windows-x64/anchor-windows-x64.zip
            anchor-windows-x64/anchor-windows-x64.zip.sha256
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
